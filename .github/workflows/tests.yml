name: tests
on: [push, pull_request]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh tests/*.sh
      - name: Functional tests
        run: NO_COLOR=1 ./tests/run_tests.sh
